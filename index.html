<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAREAS LPA</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <img src="assets/logo.png" alt="Logo LPA" class="login-logo" />
      <h1 class="login-title">TAREAS LPA</h1>
      <p class="login-subtitle">Iniciá sesión para continuar</p>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required />
        <input type="password" id="password" placeholder="Contraseña" required />
        <button type="submit">Ingresar</button>
      </form>

      <p id="loginMessage" class="login-message"></p>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
