<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAREAS LPA - Iniciar sesión</title>

  <!-- Colores institucionales -->
  <meta name="theme-color" content="#C4332A" />

  <!-- Manifest para instalación PWA -->
  <link rel="manifest" href="manifest.json" />

  <!-- Favicon e ícono -->
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />

  <!-- Estilos -->
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen">
    <img src="assets/icon.png" alt="Logo LPA" class="splash-logo" />
    <h2 class="splash-text">TAREAS LPA</h2>
  </div>

  <!-- LOGIN -->
  <div class="login-container">
    <div class="login-card">
      <img src="assets/icon.png" alt="Logo LPA" class="login-logo" />

      <h1 class="login-title">TAREAS LPA</h1>
      <p class="login-subtitle">Inicia sesión para continuar</p>

      <form id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required />
        <input type="password" id="password" placeholder="Contraseña" required />
        <button type="submit">Ingresar</button>
      </form>

      <p id="loginMessage" class="login-message"></p>
    </div>
  </div>

  <!-- Script principal de login -->
  <script src="script.js"></script>

  <!-- Registrar el Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js")
          .then((reg) => console.log("✅ Service Worker registrado con éxito:", reg.scope))
          .catch((err) => console.log("❌ Error al registrar el Service Worker:", err));
      });
    }

    // SPLASH SCREEN - Desvanece después de 1.8s
    window.addEventListener("load", () => {
      const splash = document.getElementById("splash-screen");
      setTimeout(() => {
        splash.classList.add("fade-out");
        setTimeout(() => splash.remove(), 600);
      }, 1800);
    });

    // =========================================================
    // ⏰ AUTO LOGOUT DESPUÉS DE 15 MINUTOS SIN ACTIVIDAD
    // =========================================================
    const INACTIVIDAD_MAXIMA = 15 * 60 * 1000; // 15 minutos
    let temporizadorInactividad;

    function resetearTemporizador() {
      clearTimeout(temporizadorInactividad);
      temporizadorInactividad = setTimeout(() => {
        localStorage.removeItem("usuario");
        alert("Sesión cerrada por inactividad.");
        window.location.href = "index.html";
      }, INACTIVIDAD_MAXIMA);
    }

    // Detectar actividad del usuario
    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach((evento) => {
      document.addEventListener(evento, resetearTemporizador);
    });

    resetearTemporizador(); // activar al inicio
  </script>

</body>
</html>
